    function compartilhar() {

  <script>
    const slides = document.querySelectorAll('.slide');
    const pontos = document.querySelectorAll('.ponto');
    const btnAnterior = document.querySelector('.btn-anterior');
    const btnProximo = document.querySelector('.btn-proximo');
    let indiceAtual = 0;

    // Mostra o slide ativo
    function mostrarSlide(indice) {
      slides.forEach((slide, i) => {
        slide.classList.remove('ativo');
        pontos[i].classList.remove('ativo');
      });
      slides[indice].classList.add('ativo');
      pontos[indice].classList.add('ativo');
      indiceAtual = indice;
    }

    // Próximo slide
    btnProximo.addEventListener('click', () => {
      let proximo = (indiceAtual + 1) % slides.length;
      mostrarSlide(proximo);
    });

    // Slide anterior
    btnAnterior.addEventListener('click', () => {
      let anterior = (indiceAtual - 1 + slides.length) % slides.length;
      mostrarSlide(anterior);
    });

    // Clica nos pontinhos
    pontos.forEach((ponto, i) => {
      ponto.addEventListener('click', () => {
        mostrarSlide(i);
      });
    });

    // ⏰ TROCA AUTOMÁTICA — a cada 5 segundos
    setInterval(() => {
      let proximo = (indiceAtual + 1) % slides.length;
      mostrarSlide(proximo);
    }, 5000);
  </script>
